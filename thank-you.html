<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תודה • יסודי התורה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #1a2952 0%, #253c73 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 60px 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-top: 5px solid #c9a961;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: #c9a961;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }
        
        .icon svg {
            width: 45px;
            height: 45px;
            fill: white;
        }
        
        h1 {
            font-family: 'Amiri', serif;
            color: #1a2952;
            font-size: 2.2em;
            margin: 0 0 15px;
        }
        
        p {
            color: #555;
            font-size: 1.15em;
            line-height: 1.8;
            margin: 15px 0;
        }
        
        .blessing {
            font-family: 'Amiri', serif;
            color: #c9a961;
            font-size: 1.3em;
            margin: 30px 0;
            padding: 20px 0;
            border-top: 1px solid #e0d5b7;
            border-bottom: 1px solid #e0d5b7;
        }
        
        .btn {
            display: inline-block;
            background: #1a2952;
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #253c73;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/></svg>
        </div>
        <h1>תודה!</h1>
        <p>הטופס נשלח בהצלחה למזכירות בית הספר.</p>
        <p>נחזור אליכם בהקדם במידת הצורך.</p>
        
        <div class="blessing">
            סיעתא דשמיא<br>ובברכת שנת לימודים פוריה
        </div>
        
        <a href="index.html" class="btn">חזרה לאתר</a>
    </div>
</body>
</html>
